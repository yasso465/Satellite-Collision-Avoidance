<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390"><rect width="800" height="390" fill="#ffffff"/><text x="40" y="40" font-family="Arial" font-size="23" font-weight="bold" fill="#182433">C3 vs C63: 10,000 local Monte Carlo trials each</text><text x="40" y="68" font-family="Arial" font-size="14" fill="#455468">Count of trials with minimum separation below experimental 10.5 km threshold</text><line x1="170" y1="110" x2="170" y2="280" stroke="#26374a" stroke-width="2"/><line x1="170" y1="280" x2="740" y2="280" stroke="#26374a" stroke-width="2"/><text x="80" y="151" font-family="Arial" font-size="18" fill="#26374a">C3 (0.50 m/s)</text><rect x="170" y="120" width="510" height="54" fill="#4c78a8"/><text x="690" y="155" font-family="Arial" font-size="20" fill="#26374a">11</text><text x="70" y="240" font-family="Arial" font-size="18" fill="#26374a">C63 (0.60 m/s)</text><rect x="170" y="210" width="2" height="54" fill="#e45756"/><text x="185" y="245" font-family="Arial" font-size="20" fill="#26374a">0</text><text x="170" y="318" font-family="Arial" font-size="13" fill="#455468">C3: 0.11% of modeled trials</text><text x="170" y="343" font-family="Arial" font-size="13" fill="#455468">C63: 0 observed; does not imply zero collision probability</text></svg>